name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npx playwright-core install webkit
      - run: npm run e2e:selection
      - run: npm run e2e:popups
      - run: npm run e2e:code
      - run: npm run e2e:summon
      - run: npm run e2e:table
      - run: npm run e2e:handle
      - run: npm run e2e:ui
      - run: npm run e2e:head
      - run: npm run e2e:overlap
      - run: npm run e2e:forms
      - run: npm run e2e:present
      - run: npm run e2e:mem
      - run: npx playwright-core install chromium
      - run: npm run e2e:diagrams
      - run: npm run verify:map
        env:
          EVE_DRIVES_OUT: ${{ runner.temp }}/eve-drives
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: |
            e2e/out
            ${{ runner.temp }}/eve-drives
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/android-unit-test.sh
