name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npx playwright-core install webkit
      - run: npm run e2e:selection
      - run: npm run e2e:popups
      - run: npm run e2e:code
      - name: caret probe (diagnostic)
        continue-on-error: true
        run: node e2e/caretProbe.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/out
