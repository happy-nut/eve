# The Mac and the phone release on their own:
#   tag v*          -> Eve.app on an Apple-silicon runner -> release with Eve-macos-arm64.zip (Latest;
#                      the Homebrew cask, happy-nut/homebrew-tap, points at releases/latest)
#   tag android-v*  -> the signed APK -> its own release with Eve-android.apk, never marked Latest (the
#                      phone-setup page, docs/android/, and the app's updater look for the newest APK)
# The phone's version is src-tauri/tauri.android.conf.json; the Mac's is tauri.conf.json.
name: release
on:
  push:
    tags: ['v*', 'android-v*']
permissions:
  contents: write
jobs:
  build:
    if: startsWith(github.ref_name, 'v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run bundle
      - run: ditto -c -k --keepParent src-tauri/target/release/bundle/macos/Eve.app Eve-macos-arm64.zip
      - run: gh release create "$GITHUB_REF_NAME" Eve-macos-arm64.zip --title "Eve $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  android:
    if: startsWith(github.ref_name, 'android-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: npm ci
      # the release key: ANDROID_KEYSTORE = base64 of the .jks, ANDROID_KEYSTORE_PASSWORD = its password
      - run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/eve-release.jks"
          printf 'storeFile=%s\npassword=%s\nkeyAlias=eve\n' "$RUNNER_TEMP/eve-release.jks" "$ANDROID_KEYSTORE_PASSWORD" > src-tauri/gen/android/keystore.properties
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      # the runner's own NDK: a shell variable, not something the `env` context can see
      - run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" npm run tauri -- android build --apk --target aarch64
      - run: |
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk Eve-android.apk
          gh release create "$GITHUB_REF_NAME" Eve-android.apk --title "Eve for Android ${GITHUB_REF_NAME#android-v}" --generate-notes --latest=false
        env:
          GH_TOKEN: ${{ github.token }}
