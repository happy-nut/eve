# The Mac and the phone release on their own:
#   tag v*          -> Eve.app on an Apple-silicon runner -> release with Eve-macos-arm64.zip (Latest;
#                      the Homebrew cask, happy-nut/homebrew-tap, points at releases/latest)
#   Run workflow (workflow_dispatch) with tag v<version> -> the same Mac release from the branch it runs on,
#                      the tag made along with it: for when a tag cannot be pushed
#   tag android-v*  -> the signed APK -> its own release with Eve-android.apk, never marked Latest (the
#                      phone-setup page, docs/android/, and the app's updater look for the newest APK)
# The phone's version is src-tauri/tauri.android.conf.json; the Mac's is tauri.conf.json.
name: release
on:
  push:
    tags: ['v*', 'android-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Mac release to make: v + the version in src-tauri/tauri.conf.json (e.g. v0.7.12)'
        required: true
permissions:
  contents: write
jobs:
  build:
    if: startsWith(github.ref_name, 'v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # run by hand: the tag must be the app's own version, and not taken yet
      - if: github.event_name == 'workflow_dispatch'
        run: |
          V="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          [ "$TAG" = "$V" ] || { echo "::error::$TAG is not the app's version ($V)"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then echo "::error::$TAG exists already"; exit 1; fi
        env:
          TAG: ${{ inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run bundle
      - run: ditto -c -k --keepParent src-tauri/target/release/bundle/macos/Eve.app Eve-macos-arm64.zip
      # a pushed tag is there already; run by hand, the release makes it at the commit just built
      - run: gh release create "$TAG" Eve-macos-arm64.zip --title "Eve $TAG" --generate-notes --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}

  android:
    if: startsWith(github.ref_name, 'android-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: npm ci
      # the release key: ANDROID_KEYSTORE = base64 of the .jks, ANDROID_KEYSTORE_PASSWORD = its password
      - run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/eve-release.jks"
          printf 'storeFile=%s\npassword=%s\nkeyAlias=eve\n' "$RUNNER_TEMP/eve-release.jks" "$ANDROID_KEYSTORE_PASSWORD" > src-tauri/gen/android/keystore.properties
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      # the runner's own NDK: a shell variable, not something the `env` context can see
      - run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" npm run tauri -- android build --apk --target aarch64
      - run: |
          V="${GITHUB_REF_NAME#android-v}"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "Eve-android-$V.apk"
          # the same file under the plain name, which the updaters in 0.7.2 - 0.7.6 look for
          cp "Eve-android-$V.apk" Eve-android.apk
          gh release create "$GITHUB_REF_NAME" "Eve-android-$V.apk" Eve-android.apk --title "Eve for Android $V" --generate-notes --latest=false
        env:
          GH_TOKEN: ${{ github.token }}
