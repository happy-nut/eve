<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Eve for Android</title>
<link rel="icon" href="../icon.svg">
<style>
  /* the app's EVE palette: shell white, soft gray, visor ink, eye blue */
  :root { --fg: #33363d; --dim: #7c8089; --bg: #f2f3f5; --accent: #1e9bff; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --fg: #d3d6dc; --dim: #8b909a; --bg: #0b0c10; --accent: #3fc1ff; } }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, Roboto, 'Noto Sans KR', system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px 16px;
    text-align: center;
  }
  img { width: 72px; height: 72px; border-radius: 16px; }
  p { margin: 0; max-width: 340px; }
  .dim { color: var(--dim); font-size: 14px; }
  a { color: var(--accent); font-weight: 600; text-decoration: none; }
  [hidden] { display: none !important; }
  .get {
    display: inline-block; margin-top: 6px; padding: 14px 26px; border-radius: 14px; background: var(--accent); color: #fff;
    font-size: 17px; font-weight: 600;
  }
</style>
</head>
<body>
  <img src="../icon.svg" alt="">
  <p id="msg" data-t="opening">Opening Eve…</p>
  <a class="get" id="get" hidden href="#"></a>
  <p class="dim" id="hint" hidden data-t="hint">Already updated? <a id="retry" href="#">Open Eve</a></p>
<script>
  // One QR: without Eve, or with one too old to update itself, it downloads the newest APK; with a
  // current Eve it opens it with the Mac's ticket, and Eve offers any newer version itself.
  // (#install instead: only the download.) without Eve this starts the APK download; with Eve installed it opens
  // Eve with the Mac's ticket. The fragment never leaves the phone.
  // the Mac's ticket (#h=…&p=…&k=…): handed to the app as is; the app checks it
  const ticket = location.hash.slice(1);
  const android = /Android/i.test(navigator.userAgent);
  const LATEST = 'https://github.com/happy-nut/eve/releases'; // the API was unreachable: the list of releases

  const ko = {
    opening: 'Eve 여는 중…', hint: '', desktop: '이 링크는 Android 폰에서 여세요 — Mac의 Eve 설정에 있는 QR을 폰 카메라로 찍으면 됩니다.',
    installing: '최신 Eve를 내려받고 있어요. 받은 파일을 열어 설치(업데이트)하면 노트와 로그인은 그대로예요.',
    get: 'Eve 내려받기', after: '받은 파일을 열어 설치(업데이트)를 누르세요. 노트와 로그인은 그대로예요. 그다음 Mac의 QR을 한 번 더 찍으면 로그인까지 끝납니다.',
  };
  const en = {
    desktop: "Open this on your Android phone — scan the QR in Eve's settings on your Mac with its camera.",
    installing: 'Downloading the newest Eve. Open it and tap Install (or Update); notes and the sign-in stay.',
    get: 'Download Eve', after: 'Open the download and tap Install (or Update); notes and the sign-in stay. Then scan the QR on your Mac once more to sign in.',
  };
  const t = (k) => (/^ko/i.test(navigator.language) && ko[k]) || en[k];
  if (/^ko/i.test(navigator.language)) {
    document.documentElement.lang = 'ko';
    document.getElementById('msg').textContent = ko.opening;
    document.getElementById('hint').innerHTML = '이미 업데이트했나요? <a id="retry" href="#">Eve 열기</a>';
  }

  /** The highest-versioned published release that carries the APK (a prerelease counts; a draft cannot be downloaded). */
  async function apkUrl() {
    // the Mac put the newest phone version in the QR (?v=0.7.6): that APK, no need to ask GitHub
    const given = new URLSearchParams(location.search).get('v');
    if (given && /^\d+(\.\d+){1,3}$/.test(given)) {
      return { url: `https://github.com/happy-nut/eve/releases/download/android-v${given}/Eve-android-${given}.apk`, version: given };
    }
    try {
      // no-store: a phone's browser had answered from a day-old copy of this list
      const rs = await (await fetch('https://api.github.com/repos/happy-nut/eve/releases?per_page=10', { cache: 'no-store' })).json();
      // the highest version, not the first: the API puts the Latest release (the Mac's) first
      const v = (t) => (/\d+(?:\.\d+)*/.exec(t)?.[0] ?? '0').split('.').map(Number);
      const higher = (a, b) => { for (let i = 0; i < 4; i++) if ((a[i] ?? 0) !== (b[i] ?? 0)) return (a[i] ?? 0) > (b[i] ?? 0); return false; };
      let best = null;
      for (const r of rs) {
        // the file with the version in its name (Eve-android.apk is the same file, for older updaters)
        const apks = r.draft ? [] : (r.assets ?? []).filter((x) => /^Eve-android(-[\d.]+)?\.apk$/.test(x.name));
        const a = apks.find((x) => x.name !== 'Eve-android.apk') ?? apks[0];
        if (a && (!best || higher(v(r.tag_name), best.v))) best = { v: v(r.tag_name), url: a.browser_download_url };
      }
      if (best) return { url: best.url, version: best.v.join('.') };
    } catch { /* offline or rate-limited: the latest release's link */ }
    return { url: LATEST, version: '' };
  }

  (async () => {
    if (!android) return (document.getElementById('msg').textContent = t('desktop'));
    const { url: apk, version } = await apkUrl();
    const get = document.getElementById('get');
    get.href = apk;
    get.textContent = t('get') + (version ? ' ' + version : '');
    // the Mac's "Install or update" QR: always the newest APK, even with (an older) Eve installed
    if (ticket === 'install') {
      document.getElementById('msg').textContent = t('installing');
      return location.replace(apk);
    }
    const code = /^[\w=&%.:-]+$/.test(ticket) ? ticket : '';
    // Chrome opens the installed app straight away; without it, it follows the fallback: the APK
    // "signin" is answered only by an Eve that updates itself; an older one falls back to the newest APK
    const intent = `intent://signin${code ? '?' + code : ''}#Intent;scheme=eve;package=dev.happynut.eve;` +
      `S.browser_fallback_url=${encodeURIComponent(apk)};end`;
    document.getElementById('retry').href = intent;
    location.replace(intent);
    // still here after a moment: Eve did not open — none installed, or one too old to update itself. The
    // browser may already be downloading (Chrome's fallback) or may have ignored it (other browsers):
    // either way, one big button for the newest APK and what to do with it
    setTimeout(() => {
      if (document.hidden) return; // Eve opened
      document.getElementById('msg').textContent = t('after');
      get.hidden = false;
      document.getElementById('hint').hidden = false;
    }, 1500);
  })();
</script>
</body>
</html>
