<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#1a2230"/><stop offset="1" stop-color="#0a0c11"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9dde3"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1e25"/><stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- head: egg shape -->
  <path filter="url(#shadow)" fill="url(#body)"
        d="M512 176c168 0 282 132 282 318 0 190-120 354-282 354S230 684 230 494c0-186 114-318 282-318z"/>
  <!-- visor -->
  <path fill="url(#visor)"
        d="M512 322c118 0 196 72 196 166 0 92-78 156-196 156s-196-64-196-156c0-94 78-166 196-166z"/>
  <!-- eyes -->
  <g fill="#3fc1ff" filter="url(#glow)">
    <ellipse cx="438" cy="478" rx="58" ry="24" transform="rotate(-14 438 478)"/>
    <ellipse cx="586" cy="478" rx="58" ry="24" transform="rotate(14 586 478)"/>
  </g>
</svg>
