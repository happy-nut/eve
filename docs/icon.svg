<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#1b2534"/><stop offset="1" stop-color="#090b10"/>
    </radialGradient>
    <radialGradient id="body" cx="38%" cy="28%" r="80%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#eef0f3"/><stop offset="1" stop-color="#c9ced6"/>
    </radialGradient>
    <radialGradient id="visor" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#1c2a3a"/><stop offset="0.7" stop-color="#0b1019"/><stop offset="1" stop-color="#04060a"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8fbff"/><stop offset="0.35" stop-color="#7fe0ff"/><stop offset="0.75" stop-color="#2eb8ff"/><stop offset="1" stop-color="#1a8fe0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000" flood-opacity=".6"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- head: rounded shell, slightly wider at the top -->
  <path filter="url(#shadow)" fill="url(#body)"
        d="M512 168c188 0 318 138 318 326 0 176-124 342-318 342S194 670 194 494c0-188 130-326 318-326z"/>
  <!-- visor: rounded inverted triangle -->
  <path fill="url(#visor)"
        d="M286 542 C286 616 386 666 512 666 C638 666 738 616 738 542 C738 482 690 392 630 336 C560 282 464 282 394 336 C334 392 286 482 286 542 Z"/>
  <!-- eyes -->
  <g fill="#3fc1ff" filter="url(#glow)">
    <ellipse cx="442" cy="500" rx="60" ry="38" transform="rotate(14 442 500)"/>
    <ellipse cx="582" cy="500" rx="60" ry="38" transform="rotate(-14 582 500)"/>
  </g>
</svg>
