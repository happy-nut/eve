<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300">
  <defs>
    <radialGradient id="bgb" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#1b2534"/><stop offset="1" stop-color="#090b10"/>
    </radialGradient>
    <radialGradient id="body" cx="38%" cy="28%" r="80%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#eef0f3"/><stop offset="1" stop-color="#c9ced6"/>
    </radialGradient>
    <radialGradient id="visor" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#1c2a3a"/><stop offset="0.7" stop-color="#0b1019"/><stop offset="1" stop-color="#04060a"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e8fbff"/><stop offset="0.35" stop-color="#7fe0ff"/><stop offset="0.75" stop-color="#2eb8ff"/><stop offset="1" stop-color="#1a8fe0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000" flood-opacity=".6"/>
    </filter>
  </defs>
  <radialGradient id="bgw" cx="25%" cy="50%" r="80%"><stop offset="0" stop-color="#1b2534"/><stop offset="1" stop-color="#090b10"/></radialGradient>
  <rect width="960" height="300" rx="24" fill="url(#bgw)"/>
  <g transform="translate(70 40) scale(0.215)">
  <!-- head: rounded shell, slightly wider at the top -->
  <path filter="url(#shadow)" fill="url(#body)"
        d="M512 168c188 0 318 138 318 326 0 176-124 342-318 342S194 670 194 494c0-188 130-326 318-326z"/>
  <!-- visor: rounded inverted triangle -->
  <path fill="url(#visor)"
        d="M286 420 C286 346 386 296 512 296 C638 296 738 346 738 420 C738 480 690 570 630 626 C560 680 464 680 394 626 C334 570 286 480 286 420 Z"/>
  <!-- eyes -->
  <g fill="#3fc1ff" filter="url(#glow)">
    <ellipse cx="440" cy="462" rx="60" ry="38" transform="rotate(14 440 462)"/>
    <ellipse cx="584" cy="462" rx="60" ry="38" transform="rotate(-14 584 462)"/>
  </g>
</g>
  <text x="330" y="150" font-family="-apple-system, Inter, Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="#ffffff" letter-spacing="-3">Eve</text>
  <text x="332" y="200" font-family="-apple-system, Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#8b909a">Fast, keyboard-first markdown notes for macOS.</text>
  <text x="332" y="232" font-family="-apple-system, Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#3fc1ff">Summon it from anywhere. ⌘⇧Space</text>
</svg>