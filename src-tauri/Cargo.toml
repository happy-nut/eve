[package]
name = "eve"
version = "0.6.2"
description = "Fast, keyboard-first markdown notes"
authors = ["happynut"]
license = "MIT"
repository = "https://github.com/happy-nut/eve"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "eve_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# LaunchServices: which app macOS opens a .md with
core-foundation = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
