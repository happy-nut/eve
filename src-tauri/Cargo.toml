[package]
name = "eve"
version = "0.6.6"
description = "Fast, keyboard-first markdown notes"
authors = ["happynut"]
license = "MIT"
repository = "https://github.com/happy-nut/eve"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "eve_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
# the note's own Paste: WebKit blocks execCommand("paste") and the async clipboard API is not dependable here
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# LaunchServices: which app macOS opens a .md with
core-foundation = "0.10"
# "Export as PDF" prints the note to a file: a print job that saves needs no printer, and no panel
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation", "NSGraphics"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "objc2-app-kit"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
